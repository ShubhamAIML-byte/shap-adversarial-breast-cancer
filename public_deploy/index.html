                  </div>

                  {/* Clinical Epidemiological Summary */}
                  <div className="card-subtle p-6 space-y-3 text-xs leading-relaxed">
                    <h3 className="text-base font-bold text-slate-900">Clinical Evaluation Rationale</h3>
                    <p className="text-slate-600">
                      In breast cancer diagnosis, <strong>Sensitivity (Recall)</strong> is paramount: missing a malignant
                      lesion directly compromises patient survival. The clean XGBoost classifier misses only 1 of 32 malignant
                      cases on the test set.
                    </p>
                    <p className="text-slate-600">
                      However, when adversarial noise shifts feature values by as little as $\epsilon=0.15 \cdot \sigma$,
                      this clinical safety collapses: 17 malignant biopsies are missed under baseline testing.
                    </p>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: SHAP EXPLAINABILITY */}
            {tab === 'explainability' && (
              <div className="card-subtle p-6 space-y-5">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="text-base font-bold text-slate-900">Global Mean |SHAP Value| Importance Rankings</h3>
                  <span className="text-xs font-mono font-bold text-teal-700 bg-teal-50 px-2 py-0.5 rounded">
                    TreeExplainer Exact
                  </span>
                </div>

                <div className="space-y-2.5">
                  {GLOBAL_SHAP.map((item, idx) => (
                    <div key={item.feature} className="space-y-1">
                      <div className="flex justify-between text-xs font-semibold text-slate-700">
                        <span>#{idx+1} {item.feature}</span>
                        <span className="font-mono text-teal-700 font-bold">{item.val} |SHAP|</span>
                      </div>
                      <div className="h-2.5 w-full bg-slate-100 rounded-full overflow-hidden">
                        <div
                          className="bg-teal-600 h-full rounded-full"
                          style={{ width: `${(item.val / 2.0) * 100}%` }}
                        />
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 5: ADVERSARIAL ROBUSTNESS */}
            {tab === 'adversarial' && (
              <div className="space-y-6">
                <div className="card-subtle p-6 space-y-4">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-100 pb-3">
                    <h3 className="text-base font-bold text-slate-900">Adversarial Simulation Controller</h3>
                    <span className="text-xs font-mono font-bold text-rose-700 bg-rose-50 px-2.5 py-1 rounded">
                      Bounded Perturbation
                    </span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                    <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                      <div className="flex justify-between font-bold">
                        <span>Strength (ε):</span>
                        <span className="font-mono text-teal-700 font-bold">ε = {epsilon.toFixed(2)}</span>
                      </div>
                      <input
                        type="range"
                        min="0.01"
                        max="0.40"
                        step="0.01"
                        value={epsilon}
                        onChange={e => setEpsilon(parseFloat(e.target.value))}
                        className="w-full accent-teal-600 cursor-pointer"
                      />
                    </div>

                    <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                      <span className="font-bold block">Attack Strategy:</span>
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          onClick={() => setPertType('shap_guided')}
                          className={`py-1.5 rounded-lg font-bold text-center ${
                            pertType === 'shap_guided' ? 'bg-rose-600 text-white' : 'bg-white border text-slate-700'
                          }`}
                        >
                          SHAP-Guided
                        </button>
                        <button
                          onClick={() => setPertType('random')}
                          className={`py-1.5 rounded-lg font-bold text-center ${
                            pertType === 'random' ? 'bg-blue-600 text-white' : 'bg-white border text-slate-700'
                          }`}
                        >
                          Random
                        </button>
                      </div>
                    </div>

                    <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                      <span className="font-bold block">Active Model Defense:</span>
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          onClick={() => setModel('baseline')}
                          className={`py-1.5 rounded-lg font-bold text-center ${
                            model === 'baseline' ? 'bg-slate-900 text-white' : 'bg-white border text-slate-700'
                          }`}
                        >
                          Baseline
                        </button>
                        <button
                          onClick={() => setModel('robust')}
                          className={`py-1.5 rounded-lg font-bold text-center ${
                            model === 'robust' ? 'bg-teal-600 text-white' : 'bg-white border text-slate-700'
                          }`}
                        >
                          Robust
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Flip Result Cards */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="card-subtle p-6 space-y-3">
                    <span className="text-xs font-bold text-slate-400 uppercase">Original Clean Specimen</span>
                    <div className="text-2xl font-black text-rose-700">MALIGNANT</div>
                    <div className="text-xs font-mono text-slate-600">P(Malignant) = {(cleanProbMal * 100).toFixed(1)}%</div>
                  </div>

                  <div className={`card-subtle p-6 space-y-3 border-2 ${
                    isFlipped ? 'border-rose-300 bg-rose-50/40' : 'border-teal-300 bg-teal-50/40'
                  }`}>
                    <span className="text-xs font-bold text-slate-400 uppercase">Perturbed Adversarial Specimen</span>
                    <div className={`text-2xl font-black ${isMalignantPert ? 'text-rose-700' : 'text-emerald-700'}`}>
                      {isMalignantPert ? 'MALIGNANT (DEFENDED)' : 'BENIGN (EVASION FLIP)'}
                    </div>
                    <div className="text-xs font-mono text-slate-600">
                      P(Malignant) = {(pertProbMal * 100).toFixed(1)}% | Status: {isFlipped ? 'FLIPPED' : 'RESISTED'}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 6: SHAP FEATURE SHIFT */}
            {tab === 'feature-shift' && (
              <div className="card-subtle p-6 space-y-5">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="text-base font-bold text-slate-900">Pre- vs Post-Attack SHAP Attribution Drift</h3>
                  <span className="text-xs font-mono font-bold text-teal-700 bg-teal-50 px-2.5 py-1 rounded">
                    Spearman ρ = {model === 'robust' ? BENCHMARK.spearman_robust : BENCHMARK.spearman_baseline}
                  </span>
                </div>

                <div className="overflow-x-auto text-xs">
                  <table className="w-full text-left">
                    <thead className="border-b border-slate-200 text-slate-400 uppercase font-bold text-[10px]">
                      <tr>
                        <th className="py-2 px-3">Diagnostic Feature</th>
                        <th className="py-2 px-3">Clean SHAP</th>
                        <th className="py-2 px-3">Perturbed SHAP</th>
                        <th className="py-2 px-3">Attribution Delta (Δ)</th>
                        <th className="py-2 px-3">Ranking Stability</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-mono">
                      {[
                        { f: "worst concave points", c: 1.84, p: model === 'robust' ? 1.62 : 0.62, d: model === 'robust' ? -0.22 : -1.22, s: model === 'robust' ? 'Stable (Protected)' : 'Severe Collapse' },
                        { f: "worst perimeter", c: 1.42, p: model === 'robust' ? 1.25 : 0.78, d: model === 'robust' ? -0.17 : -0.64, s: model === 'robust' ? 'Stable' : 'Moderate Shift' },
                        { f: "worst area", c: 1.35, p: model === 'robust' ? 1.19 : 0.81, d: model === 'robust' ? -0.16 : -0.54, s: model === 'robust' ? 'Stable' : 'Moderate Shift' },
                        { f: "mean concave points", c: 1.18, p: model === 'robust' ? 1.04 : 0.52, d: model === 'robust' ? -0.14 : -0.66, s: model === 'robust' ? 'Stable' : 'Moderate Shift' }
                      ].map(r => (
                        <tr key={r.f} className="hover:bg-slate-50">
                          <td className="py-2.5 px-3 font-sans font-semibold text-slate-800 capitalize">{r.f}</td>
                          <td className="py-2.5 px-3 text-teal-700 font-bold">{r.c}</td>
                          <td className="py-2.5 px-3 text-rose-700 font-bold">{r.p}</td>
                          <td className="py-2.5 px-3 text-slate-700">{r.d}</td>
                          <td className="py-2.5 px-3">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-sans font-bold ${
                              r.s.includes('Stable') ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'
                            }`}>
                              {r.s}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB 7: COMPARISON */}
            {tab === 'comparison' && (
              <div className="card-subtle p-6 space-y-6">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="text-base font-bold text-slate-900">3-Way Comparative Benchmark</h3>
                  <span className="text-xs font-mono font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded">
                    79.76% ASR Cut
                  </span>
                </div>

                <div className="overflow-x-auto text-xs">
                  <table className="w-full text-left border border-slate-200 rounded-lg">
                    <thead className="bg-slate-50 text-slate-700 font-bold uppercase text-[10px]">
                      <tr>
                        <th className="p-3">Evaluation Metric</th>
                        <th className="p-3">Baseline (Clean)</th>
                        <th className="p-3">Baseline (Adv ε=0.15)</th>
                        <th className="p-3">SHAP-Robust (Clean)</th>
                        <th className="p-3">SHAP-Robust (Adv ε=0.15)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-mono text-[11px]">
                      <tr>
                        <td className="p-3 font-sans font-bold text-slate-800">Accuracy</td>
                        <td className="p-3 text-blue-700">97.67%</td>
                        <td className="p-3 text-rose-700 font-bold">74.42% (-23.25%)</td>
                        <td className="p-3 text-slate-700">96.51%</td>
                        <td className="p-3 text-teal-700 font-bold">91.86% (+17.44%)</td>
                      </tr>
                      <tr>
                        <td className="p-3 font-sans font-bold text-slate-800">Sensitivity (Recall)</td>
                        <td className="p-3 text-blue-700">96.88%</td>
                        <td className="p-3 text-rose-700 font-bold">46.88% (17 missed)</td>
                        <td className="p-3 text-slate-700">93.75%</td>
                        <td className="p-3 text-teal-700 font-bold">87.50% (Protected)</td>
                      </tr>
                      <tr>
                        <td className="p-3 font-sans font-bold text-slate-800">Attack Success Rate (ASR)</td>
                        <td className="p-3 text-slate-400">0.0%</td>
                        <td className="p-3 text-rose-700 font-bold">23.81% (20/84)</td>
                        <td className="p-3 text-slate-400">0.0%</td>
                        <td className="p-3 text-emerald-700 font-bold">4.82% (4/83)</td>
                      </tr>
                      <tr>
                        <td className="p-3 font-sans font-bold text-slate-800">Spearman Rank Corr (ρ)</td>
                        <td className="p-3 text-slate-400">1.0000</td>
                        <td className="p-3 text-rose-700 font-bold">0.6124</td>
                        <td className="p-3 text-slate-400">1.0000</td>
                        <td className="p-3 text-teal-700 font-bold">0.8912 (+45.5%)</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB 8: REPORT */}
            {tab === 'report' && (
              <div className="card-subtle p-8 space-y-6">
                <div className="flex justify-between items-center border-b border-slate-200 pb-4">
                  <div>
                    <h3 className="text-xl font-black text-slate-900">Academic Thesis Research Report</h3>
                    <p className="text-xs text-slate-500">M.Tech Artificial Intelligence & Machine Learning</p>
                  </div>
                  <button
                    onClick={() => window.print()}
                    className="px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs shadow-md"
                  >
                    Print / Save PDF
                  </button>
                </div>

                <div className="space-y-4 text-xs leading-relaxed text-slate-700">
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <strong className="block text-slate-900 text-sm mb-1">Abstract</strong>
                    In this thesis investigation, we demonstrated that TreeExplainer SHAP attributions reliably isolate
                    the most vulnerable decision boundaries in XGBoost models trained on the WDBC dataset. Applying
                    bounded perturbations to top SHAP features induced prediction flips in 23.81% of correctly classified
                    cases. Through SHAP-guided adversarial augmentation, the resulting robust model suppressed ASR to 4.82%
                    while maintaining 96.51% clean accuracy.
                  </div>

                  <div className="border-t border-slate-200 pt-4 flex justify-between items-end text-[11px] text-slate-500">
                    <div>
                      <div className="font-bold text-slate-800">{researcher}</div>
                      <div>{institution}</div>
                    </div>
                    <div className="font-mono text-teal-700">Verified Benchmark Artifacts • WDBC-XAI-ADV-2026</div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
